databaseChangeLog:
  - changeSet:
      id: create-agency
      author: you
      changes:
        - createTable:
            tableName: agency
            schemaName: gtfs_public
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false            
              - column: { name: agency_id, type: varchar(255) }
              - column: { name: agency_name, type: varchar(255) }
              - column: { name: agency_url, type: varchar(255) }
              - column: { name: agency_timezone, type: varchar(255) }
              - column: { name: agency_lang, type: varchar(255) }
              - column: { name: agency_phone, type: varchar(255) }
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              CREATE TABLE gtfs_staging.agency (LIKE gtfs_public.agency INCLUDING ALL);
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              CREATE TABLE gtfs_backup.agency (LIKE gtfs_public.agency INCLUDING ALL);              