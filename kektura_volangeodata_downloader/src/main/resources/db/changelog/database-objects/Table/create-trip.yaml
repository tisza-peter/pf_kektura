databaseChangeLog:
  - changeSet:
      id: create-trips
      author: tiszapeter
      changes:
        - createTable:
            tableName: trips
            schemaName: gtfs_public
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false            
              - column: { name: route_id, type: varchar(255) }
              - column: { name: trip_id, type: varchar(255) }
              - column: { name: service_id, type: varchar(255) }
              - column: { name: trip_short_name, type: varchar(255) }
              - column: { name: trip_headsign, type: varchar(255) }
              - column: { name: direction_id, type: integer }
              - column: { name: shape_id, type: varchar(255) }
              - column: { name: wheelchair_accessible, type: integer }
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              CREATE TABLE gtfs_staging.trips (LIKE gtfs_public.trips INCLUDING ALL);
        - sql:
            splitStatements: false
            stripComments: true
            sql: >
              CREATE TABLE gtfs_backup.trips (LIKE gtfs_public.trips INCLUDING ALL);              